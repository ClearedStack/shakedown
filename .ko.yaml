# The image is built straight from source with ko. There is no Dockerfile.
# Upstream distroless static nonroot image, pinned by multi-arch index digest.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:25ac8f0c3b2334a9eb05452266bd4697864a8c8ef0ef71e5e6480d7f92868329
defaultPlatforms:
  - linux/arm64

builds:
  - id: shakedown
    main: ./cmd/shakedown
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
