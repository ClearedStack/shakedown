name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tests only. No image is built or pushed from GitHub.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: gofmt -l . | (! grep .)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
