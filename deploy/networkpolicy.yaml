# Nothing in cs-workers may send or receive anything unless a policy says so.
# Every worker pod in cs-workers is covered by default-deny and brings its own
# narrow egress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cs-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Shakedown accepts no connections and may open connections only to Muster in
# clearedstack on TCP 8080 and to cluster DNS in kube-system on port 53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shakedown
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: shakedown
    app.kubernetes.io/part-of: clearedstack
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shakedown
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clearedstack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: muster
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
